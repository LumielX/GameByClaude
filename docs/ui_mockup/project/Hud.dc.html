<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>HUD ระหว่างคืน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#39FF88}a:hover{color:#8CFFC0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(180deg, #1A1424 0%, #241A2C 55%, #140E18 100%); color: #F2EEF8; font-family: 'Kanit', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,{{vignette}}) 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 470px; top: 210px; width: 340px; height: 300px; background: radial-gradient(closest-side, rgba(255,240,210,0.22), rgba(255,240,210,0)); border-radius: 50%"></div>
  <div style="position: absolute; left: 32px; top: 28px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 15px; color: #B9B0CC">คืนที่ 1 / 3</div>
    <div style="font-size: 44px; font-weight: 800; line-height: 1">07:42</div>
  </div>
  <section aria-label="ภารกิจ" style="position: absolute; right: 32px; top: 28px; width: 300px; background: rgba(14,10,22,0.72); border: 2px solid #3A2E52; border-radius: 16px; padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 15px; color: #B9B0CC">ภารกิจ (Tab)</div>
    <div style="font-size: 18px"><span style="color: #39FF88; font-weight: 600">2/4</span> ปิดผนึก</div>
    <div style="font-size: 18px; color: #8E85A3">0/2 ขนของพิธีไปแท่นบูชา</div>
    <div style="font-size: 18px; color: #8E85A3">หนีออกประตูรั้ว</div>
  </section>
  <div aria-hidden="true" style="position: absolute; left: 636px; top: 356px; width: 8px; height: 8px; border-radius: 50%; background: #F2EEF8"></div>
  <div style="position: absolute; left: 0; right: 0; top: 390px; display: flex; justify-content: center">
    <div style="background: rgba(14,10,22,0.78); border-radius: 12px; padding: 8px 16px; font-size: 19px"><span style="display: inline-block; min-width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 8px; background: #F2EEF8; color: #0E0A16; font-weight: 800; margin-right: 10px">E</span>กดปุ่ม 4 ที่ตู้เซฟ A</div>
  </div>
  <div style="position: absolute; left: 32px; bottom: 32px; width: 300px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 15px; color: #B9B0CC"><span>แรง</span><span style="color: #39FF88">วิ่งเร็ว! (อะดรีนาลีน)</span></div>
    <div role="img" aria-label="แรงเหลือ 62 เปอร์เซ็นต์" style="height: 14px; border-radius: 7px; background: #2A2038; overflow: hidden"><div style="width: 62%; height: 100%; background: #39FF88"></div></div>
  </div>
  <div style="position: absolute; right: 32px; bottom: 32px; display: flex; align-items: center; gap: 12px; background: rgba(14,10,22,0.72); border: 2px solid #3A2E52; border-radius: 16px; padding: 12px 16px">
    <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #9E5536"></div>
    <div style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">หม้อดิน</span><span style="font-size: 14px; color: #B9B0CC">คลิกซ้าย ขว้าง · G วาง</span></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 32px; display: flex; justify-content: center">
    <div style="background: rgba(123,63,228,0.9); border-radius: 999px; padding: 8px 18px; font-size: 16px; font-weight: 600">คุณคือ ลูกทีม</div>
  </div>
  <div style="position: absolute; left: 32px; top: 120px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #B9B0CC"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #39FF88"></span>ฝน กำลังพูด</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vignette":{"editor":"range","min":0,"max":0.9,"step":0.05,"default":0.55},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { vignette: this.props.vignette ?? 0.55 };
  }
}
</script>
</body>
</html>
