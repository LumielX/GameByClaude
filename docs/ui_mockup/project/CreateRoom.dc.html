<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สร้างห้อง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#39FF88}a:hover{color:#8CFFC0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 48px 64px; background: #0E0A16; color: #F2EEF8; font-family: 'Kanit', sans-serif; display: flex; gap: 40px">
  <form style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px" aria-label="ตั้งค่าห้อง">
    <h1 style="margin: 0 0 4px; font-size: 40px; font-weight: 800">สร้างห้อง</h1>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; color: #B9B0CC">ชื่อห้อง
      <input value="บ้านผีแก๊งเรา" style="height: 52px; box-sizing: border-box; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #F2EEF8; font-family: inherit; font-size: 20px; padding: 0 16px">
    </label>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 17px; color: #B9B0CC; padding: 0; margin-bottom: 8px">ผู้เล่นสูงสุด</legend>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.n}}</button>
        </sc-for>
      </div>
    </fieldset>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 17px; color: #B9B0CC; padding: 0; margin-bottom: 8px">ร่างทรง (Spy) — เปิดได้เมื่อมี 5 คนขึ้นไป</legend>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 48px; padding: 0 22px; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #B9B0CC; font-family: inherit; font-size: 18px; cursor: pointer">ปิด</button>
        <button type="button" aria-pressed="true" style="height: 48px; padding: 0 22px; border: 2px solid #7B3FE4; border-radius: 12px; background: #7B3FE4; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer">1 คน</button>
        <button type="button" aria-pressed="false" style="height: 48px; padding: 0 22px; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #B9B0CC; font-family: inherit; font-size: 18px; cursor: pointer">2 คน (7–8 คน)</button>
      </div>
    </fieldset>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; color: #B9B0CC">ความยาวคืน
        <select style="height: 52px; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #F2EEF8; font-family: inherit; font-size: 19px; padding: 0 12px"><option>8 นาที</option><option selected>10 นาที</option><option>12 นาที</option><option>15 นาที</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; color: #B9B0CC">จำนวนคืน
        <select style="height: 52px; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #F2EEF8; font-family: inherit; font-size: 19px; padding: 0 12px"><option>1 คืน</option><option selected>3 คืน</option><option>5 คืน</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 17px; color: #B9B0CC">ความยาก
        <select style="height: 52px; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #F2EEF8; font-family: inherit; font-size: 19px; padding: 0 12px"><option>ง่าย</option><option selected>ปกติ</option><option>ยาก</option></select>
      </label>
    </div>
    <div style="display: flex; gap: 12px; margin-top: auto">
      <button type="button" style="height: 56px; padding: 0 24px; border: 2px solid #3A2E52; border-radius: 14px; background: transparent; color: #F2EEF8; font-family: inherit; font-size: 19px; cursor: pointer">กลับ</button>
      <button type="button" style="height: 56px; padding: 0 36px; border: 0; border-radius: 14px; background: #39FF88; color: #0E0A16; font-family: inherit; font-size: 21px; font-weight: 800; cursor: pointer">สร้างห้อง แล้วไปล็อบบี้</button>
    </div>
  </form>
  <aside style="flex: 0 0 380px; background: #1B1428; border: 2px solid #3A2E52; border-radius: 22px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 17px; color: #B9B0CC">รหัสห้อง (ส่งให้เพื่อน)</div>
    <div style="font-size: 60px; font-weight: 800; letter-spacing: 10px; color: #39FF88">K7Q2XP</div>
    <button type="button" style="height: 52px; border: 2px solid #39FF88; border-radius: 12px; background: transparent; color: #39FF88; font-family: inherit; font-size: 19px; font-weight: 600; cursor: pointer">คัดลอกรหัส</button>
    <div style="height: 2px; background: #3A2E52; margin: 8px 0"></div>
    <div style="font-size: 17px; color: #B9B0CC; line-height: 1.6">คืนละ 10 นาที × 3 คืน<br>ผนึกต่อคืน: 4 จุด (3–4 คน)<br>ร่างทรง: 1 คน (ถ้ามีครบ 5 คน)</div>
    <div style="margin-top: auto; font-size: 15px; color: #8E85A3; line-height: 1.5">เพื่อนกด "เข้าห้องเพื่อน" แล้วพิมพ์รหัสนี้ ไม่ต้องเปิดพอร์ต ไม่ต้องมีบัญชี</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'height: 48px; min-width: 56px; border: 2px solid #39FF88; border-radius: 12px; background: #39FF88; color: #0E0A16; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer';
    const off = 'height: 48px; min-width: 56px; border: 2px solid #3A2E52; border-radius: 12px; background: #1B1428; color: #F2EEF8; font-family: inherit; font-size: 20px; cursor: pointer';
    const counts = [2, 3, 4, 5, 6, 7, 8].map((n) => ({ n, on: n === 8 ? 'true' : 'false', style: n === 8 ? on : off }));
    return { counts };
  }
}
</script>
</body>
</html>
